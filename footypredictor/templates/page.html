{% extends "base.html" %}

{% load static %}

{% block content %}

<style>

    :root {
  --base-depth: 10;
}

.player.team-a {
    width: 40px;
    height: 40px;
    background-color: #4292C6;
    border: 2px solid #2171B5;
    border-radius: 50%;
    cursor: grab;
    position: absolute;
    z-index: 10;
}

.player.team-b {
    width: 40px;
    height: 40px;
    background-color: #FF6B6B;
    border: 2px solid #8B0000;
    border-radius: 50%;
    cursor: grab;
    position: absolute;
    z-index: 10;
}

.player:active {
    cursor: grabbing;
}

.tab-buttons {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 100;
    display: flex;
    gap: 10px;
}

.tab-button {
    padding: 10px 20px;
    background: rgba(0, 0, 0.8, 0.2);
    color: white;
    border: 2px solid white;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
    transition: all 0.3s;
}

.tab-button:hover {
    background: rgba(0, 0, 0, 0.9);
}

.tab-button.active {
    background: #000000;
    color: #FFFFFF;
}

.pitch-view {
    display: none;
    justify-content: center;
    align-items: center;
}

.pitch-view.active {
    display: flex;
    justify-content: center;
    align-items: center;
}

.tactic-container {
    display: flex;
    height: 100%;
    width: 100%;
}

.pitch-column {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
    height: 100%;
}

.middle-bar {
    flex: 1;
    position: relative;
    height: 100%;
    width: 100%;
    background-color: #FF6B6B;
}

.sidebar {
    flex: 1;
    position: relative;
    height: 100%;
    width: 95%;
    background-color: black
}

.pitch {
    width: 95%;
    aspect-ratio: 68 / 105;
    position: relative;
    background: #388e3c;
    border: 3px solid white;
}

.halfway-line {
    position: absolute;
    top: calc(50% - 1px);
    left: 0;
    width: 100%;
    height: 3px;
    background-color: white;
}

.centre-circle {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 26.9%;
    aspect-ratio: 1;
    border: 3px solid white;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-sizing: border-box;
}

.centre-spot {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 1.5%;
    aspect-ratio: 1;
    background: white;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-sizing: border-box;
    z-index: 1;
}

.top-penalty-box {
    position: absolute;
    left: 20.382%;
    top: 0;
    height: 15.714%;
    width: 59.235%;
    border: 3px solid white;
    background: #388e3c;
    border-top: 0;
    pointer-events: none;
    isolation: isolate;
    z-index: 10;
}

.top-six-yard-box {
    position: absolute;
    height: 33%;
    width: 33%;
    border: 3px solid white;
    border-top: 0;
    left: 50%;
    top: 16.67%;
    transform: translate(-50%, -50%);
    z-index: 1;
}

.top-penalty-spot {
    position: absolute;
    top: 66%;
    left: 50%;
    width: 2.5%;
    aspect-ratio: 1;
    background: white;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-sizing: border-box;
    z-index: 1;
}

.top-penalty-arc {
    position: absolute;
    top: 10.45%;
    left: 50%;
    width: 27%;
    aspect-ratio: 1;
    border: 3px solid white;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    clip-path: inset(50% 0 0 0);
    z-index: 9;
}

.bottom-penalty-box {
    position: absolute;
    left: 20.382%;
    bottom: 0;
    height: 15.714%;
    width: 59.235%;
    border: 3px solid white;
    background: #388e3c;
    border-bottom: 0;
    pointer-events: none;
    isolation: isolate;
    z-index: 10;
}

.bottom-six-yard-box {
    position: absolute;
    height: 33%;
    width: 33%;
    border: 3px solid white;
    border-bottom: 0;
    left: 50%;
    bottom: -16.67%;
    transform: translate(-50%, -50%);
    z-index: 1;
}

.bottom-penalty-spot {
    position: absolute;
    top: 33%;
    left: 50%;
    width: 2.5%;
    aspect-ratio: 1;
    background: white;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-sizing: border-box;
    z-index: 1;
}

.bottom-penalty-arc {
    position: absolute;
    top: 89.55%;
    left: 50%;
    width: 27%;
    aspect-ratio: 1;
    border: 3px solid white;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    clip-path: inset(0 0 50% 0);
    z-index: 9;
}

.top-left-corner {
    position: absolute;
    left: 0;
    top: 0;
    width: 5%;
    aspect-ratio: 1;
    border: 3px solid white;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    clip-path: inset(50% 0 0 50%);
    box-sizing: border-box;
    z-index: 1;
}

.top-right-corner {
    position: absolute;
    left: 100%;
    top: 0;
    width: 5%;
    aspect-ratio: 1;
    border: 3px solid white;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    clip-path: inset(50% 50% 0 0);
    box-sizing: border-box;
    z-index: 1;
}

.bottom-left-corner {
    position: absolute;
    left: 0;
    top: 100%;
    width: 5%;
    aspect-ratio: 1;
    border: 3px solid white;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    clip-path: inset(0 0 50% 50%);
    box-sizing: border-box;
    z-index: 1;
}

.bottom-right-corner {
    position: absolute;
    left: 100%;
    top: 100%;
    width: 5%;
    aspect-ratio: 1;
    border: 3px solid white;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    clip-path: inset(0 50% 50% 0);
    box-sizing: border-box;
    z-index: 1;
}

</style>

                    </div>
                    <div class="bottom-penalty-arc"></div>

                    <!-- Corners  -->
                    <div class="top-left-corner"></div>
                    <div class="top-right-corner"></div>
                    <div class="bottom-left-corner"></div>
                    <div class="bottom-right-corner"></div>
                </div>

                <div class="sidebar" data-team="away-attack">
                </div>
            </div>

            <div class="middle-bar" style="background-color: #4292C6"></div>

            <div class="pitch-column">

                        <div class="bottom-six-yard-box"></div>

                    <div class="bottom-penalty-arc"></div>

                    <!-- Corners  -->

                    <div class="top-right-corner"></div>
                    <div class="bottom-left-corner"></div>
                    <div class="bottom-right-corner"></div>
                </div>

                <div class="sidebar" data-team="away-defense">
                </div>
            </div>
        </div>

<script src="{% static 'footypredictor/scripts/draggable_player_icons.js' %}"></script>
<script>
function switchTab(tab) {
    // Hide all pitch views
    document.querySelectorAll('.pitch-view').forEach(view => {
        view.classList.remove('active');
    });

    // Remove active class from all buttons
    document.querySelectorAll('.tab-button').forEach(btn => {
        btn.classList.remove('active');
    });

    // Show selected pitch
    if (tab === 'attacking') {
        document.getElementById('home-tactics').classList.add('active');
        document.querySelectorAll('.tab-button')[0].classList.add('active');
    } else {
        document.getElementById('away-tactics').classList.add('active');
        document.querySelectorAll('.tab-button')[1].classList.add('active');
    }
}
</script>
